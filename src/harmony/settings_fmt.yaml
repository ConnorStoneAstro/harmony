data:
  # Only one of paths_list or paths_file should be specified
  paths_list: None # List of paths to data files
  paths_file: None # Path to a file containing data paths
  # loader should be an import dot path to the data loader function
  loader: harmony.data_loader # Data loader function or class

fitter:
  name: None # Name of the fitter (str), list for multiple fitters
  # Use dict of {fitter_name: value} for multiple fitters
  constructor: harmony.LightCurveFitter # Constructor for the fitter class
  resources: None # Resources required for the fitter (e.g., cpu, gpu, mem, time)
  settings: None # Dict of settings
  env_source: None # Path to the build environment configuration .sh

output_directory: None # Path to the output directory

launcher:
  executor: harmony.SlurmArrayExecutor # Executor for the launcher (e.g., local, slurm)
  max_parallel: None # Number of jobs to run at once
  slurm_account: None # Account to use for the launcher (e.g., Slurm account)
  slurm_extra: ["--qos=regular"] # List of extra Slurm options (list of str) exact pass through
